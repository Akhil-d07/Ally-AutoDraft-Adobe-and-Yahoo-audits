<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A11y Auto Drafter</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="floating-window">
  <div id="app">
    <header class="app-header">
      <div class="header-inner">
        <h1 id="titletop">A11y Auto Drafter <span class="app-version" id="app-version"></span></h1>
        <div class="subtitle">Manual / Automation / Template lookup</div>
        <div class="byline">
          <a class="byline-pill" href="https://github.com/Akhil-d07/Ally-AutoDraft-Adobe-and-Yahoo-audits" target="_blank" rel="noopener noreferrer">
            <svg class="gh-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
            <span>Created by <strong>Akhil</strong> &middot; GitHub</span>
            <span class="visually-hidden">(opens in a new tab)</span>
          </a>
          <span class="counter" id="issue-counter" role="status" aria-live="polite">Updated today: 0</span>
        </div>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Tool modes">
      <button class="tab-btn active" role="tab" id="tab-DATA" aria-selected="true" aria-controls="content" tabindex="0" data-mode="DATA">Manual Results</button>
      <button class="tab-btn" role="tab" id="tab-TEMPLATE" aria-selected="false" aria-controls="content" tabindex="-1" data-mode="TEMPLATE">Automation Template</button>
      <button class="tab-btn" role="tab" id="tab-SUMMARY_UPDATE" aria-selected="false" aria-controls="content" tabindex="-1" data-mode="SUMMARY_UPDATE">Summary Update</button>
      <button class="tab-btn" role="tab" id="tab-CSV_SANITY" aria-selected="false" aria-controls="content" tabindex="-1" data-mode="CSV_SANITY">CSV Sanity</button>
      <button class="tab-btn" role="tab" id="tab-JIRA_STATUS" aria-selected="false" aria-controls="content" tabindex="-1" data-mode="JIRA_STATUS">JIRA Status</button>
    </nav>

    <main class="content">
      <div id="content" role="tabpanel" aria-labelledby="tab-DATA"></div>
    </main>
  </div>

  <script src="lib/xlsx.full.min.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
